<?xml version="1.0" encoding="UTF-8"?>
<!-- Icon for the vtech_baby integration. Original, hand-written artwork: a sleeping baby's face and
     "VT" (drawn as strokes, no font), on a pink tile. Render with brand-src/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa3bf"/>
      <stop offset="1" stop-color="#e2407c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- head and ears -->
  <g fill="#ffffff">
    <circle cx="136" cy="246" r="28"/>
    <circle cx="376" cy="246" r="28"/>
    <circle cx="256" cy="240" r="122"/>
  </g>

  <!-- one curl of hair -->
  <path d="M252 122 C236 94 254 70 278 75 C296 79 300 100 284 106"
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- asleep: closed eyes, cheeks, a small smile -->
  <g fill="none" stroke="#e2407c" stroke-width="11" stroke-linecap="round">
    <path d="M196 228 q18 16 36 0"/>
    <path d="M280 228 q18 16 36 0"/>
    <path d="M240 286 q16 12 32 0"/>
  </g>
  <g fill="#ffc4d6">
    <ellipse cx="188" cy="266" rx="18" ry="11"/>
    <ellipse cx="324" cy="266" rx="18" ry="11"/>
  </g>

  <!-- "VT" -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 398 L221 450 L248 398"/>
    <path d="M268 398 H322 M295 398 V450"/>
  </g>
</svg>
