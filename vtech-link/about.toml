# cargo-about: the third-party notices for the Python module (tools/licenses.sh).
# Licences in order of preference, for crates that offer a choice.
accepted = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]
