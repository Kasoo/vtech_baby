[package]
name = "vtech-link-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
vtech-link-core = { path = "../core" }

# Not a member of the vtech-link workspace.
[workspace]

# Same dimpl fork as the workspace.
[patch.crates-io]
dimpl = { git = "https://github.com/Kasoo/dimpl", tag = "vtech-0.8.0-psk.1" }

[profile.release]
debug = 1


[[bin]]
name = "iotc_decode"
path = "fuzz_targets/iotc_decode.rs"
test = false
doc = false
bench = false

