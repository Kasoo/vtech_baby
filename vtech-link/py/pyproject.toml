[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vtech-link"
description = "LAN-direct transport for the VTech RM5754HD baby monitor, for the vtech_baby Home Assistant integration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.13"
dynamic = ["version"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Home Automation",
]

[project.urls]
Source = "https://gitlab.com/jonathanduncan/vtech_baby"
Issues = "https://github.com/Kasoo/vtech_baby/issues"

[tool.maturin]
module-name = "_vtech_link"
