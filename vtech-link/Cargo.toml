[workspace]
resolver = "3"
members = ["core", "py", "cli", "sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
vtech-link-core = { path = "core" }
dimpl = { version = "0.9", default-features = false, features = ["rust-crypto"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20 = "0.9"
chacha20poly1305 = "0.10"
socket2 = "0.6"
if-addrs = "0.15"
log = "0.4"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "warn"
cast_possible_truncation = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
dimpl = { git = "https://github.com/Kasoo/dimpl", tag = "vtech-0.9.0-psk.1" }
