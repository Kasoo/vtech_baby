# CI on GitLab.com's hosted runners. Free namespaces get 400 compute minutes a month, so pipelines run
# only on tags and from the Run pipeline button. In a button pipeline the module builds are manual.
#
# hassfest and the HACS check stay on the GitHub mirror (.github/workflows/validate.yml): hacs/action
# runs only as a GitHub Action and reads the repository from GitHub's API.

stages: [test, build, verify, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  GIT_DEPTH: "50"
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

# A release tag has to match every recorded version, checked before any compute minutes go on the builds.
version-check:
  stage: .pre
  image: docker.io/library/python:3.14
  tags: [saas-linux-small-amd64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - ./set_version.py --check "$CI_COMMIT_TAG"

# Workspace tests (simulator scenarios, OpenSSL interop), clippy, the fuzz targets' check and the
# Python module's tests.
vtech-link:
  stage: test
  image: docker.io/library/rust:1.99.1
  tags: [saas-linux-small-amd64]
  cache:
    key: vtech-link-test
    paths: [.cache/cargo, vtech-link/target]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl python3 >/dev/null
    - export PATH=$CARGO_HOME/bin:$PATH
    - cd vtech-link && rustup toolchain install   # rust-toolchain.toml's toolchain, components and targets
  script:
    - cargo test --workspace --locked
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo check --locked --manifest-path fuzz/Cargo.toml
    - py/tests/run.sh
    # Every crate but syn at one version.
    - dup=$(cargo tree -d -e normal --workspace --locked --depth 0 --prefix none | sed -n 's/^\([A-Za-z0-9_-]*\) v.*/\1/p' | sort -u | grep -vx syn || true)
    - '[ -z "$dup" ] || { echo "duplicated crates: $dup"; exit 1; }'
  artifacts:
    paths: [vtech-link/target/debug/sim-camera]
    expire_in: 1 day

# The integration's offline tests, against a stand-in for the module.
pytest:
  stage: test
  image: docker.io/library/python:3.14
  tags: [saas-linux-small-amd64]
  cache:
    key: pytest
    paths: [.cache/pip]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
    - python3 -m venv .venv && .venv/bin/pip install -q -r requirements_test.txt
  script:
    - .venv/bin/pytest

# release.sh builds in podman containers, so each build job runs podman inside its job container (the
# saas-linux runners are privileged). Bind mounts then see the job's checkout, which Docker-in-Docker's
# would not. --network=host keeps the build containers off a bridge, which avoids the MTU mismatch the
# docs report for container networking on the arm64 runners. Each arch builds natively on its own runner.
.build:
  stage: build
  image: quay.io/podman/stable:v5.8
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    RUN_OPTS: --network=host
  before_script:
    - dnf -y -q install git-core diffutils >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - vtech-link/release.sh $SETS
    - vtech-link/tools/ha_import_check.sh $SETS
    - (cd vtech-link/dist && sha256sum */_vtech_link.abi3.so > SHA256SUMS-$ARCH && echo "$CI_COMMIT_SHA" > REVISION-$ARCH)
  artifacts:
    paths: [vtech-link/dist/]
    expire_in: 90 days

build-x86_64:
  extends: .build
  tags: [saas-linux-small-amd64]
  variables:
    ARCH: x86_64
    SETS: x86_64-glibc x86_64-musl
  cache:
    key: build-x86_64
    paths: [vtech-link/build/cache/]

build-aarch64:
  extends: .build
  tags: [saas-linux-small-arm64]
  variables:
    ARCH: aarch64
    SETS: aarch64-glibc aarch64-musl
  cache:
    key: build-aarch64
    paths: [vtech-link/build/cache/]

# The module tests against the release build of x86_64-glibc, which has the profile that ships. The
# needs make it wait for build-x86_64, which is manual outside tags; a later stage alone wouldn't.
module-release:
  stage: verify
  image: docker.io/library/python:3.14
  tags: [saas-linux-small-amd64]
  needs: [vtech-link, build-x86_64]
  variables:
    VTECH_LINK_MODULE: $CI_PROJECT_DIR/vtech-link/dist/x86_64-glibc/_vtech_link.abi3.so
    VTECH_SIM: $CI_PROJECT_DIR/vtech-link/target/debug/sim-camera
  script:
    - python3 -m venv .venv && .venv/bin/pip install -q pytest cryptography
    - .venv/bin/python -m unittest discover -s vtech-link/py/tests -t vtech-link/py/tests
    - .venv/bin/pytest tests/test_link_session.py -k test_load_the_real_module

# A version tag makes a GitLab release: the wheels, their checksums and the revision, stored in the
# package registry because job artifacts expire. CI holds no PyPI or GitHub credentials; publish.sh takes
# the release from here to both.
gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.128.0
  tags: [saas-linux-small-amd64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  needs:
    - job: build-x86_64
    - job: build-aarch64
    - job: module-release
      artifacts: false
    - job: pytest
      artifacts: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - mkdir release-assets
    - cp vtech-link/dist/*/*.whl release-assets/
    - (cd release-assets && sha256sum *.whl > SHA256SUMS)
    - echo "$CI_COMMIT_SHA" > release-assets/REVISION
    - git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$CI_COMMIT_TAG" > notes.md
    - glab release create "$CI_COMMIT_TAG" release-assets/* --name "$CI_COMMIT_TAG" --notes-file notes.md --ref "$CI_COMMIT_SHA" --no-update --use-package-registry --package-name vtech-link
